name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AGORAGENTIC_NO_SPEND: "1"
      AGORAGENTIC_ALLOW_REAL_SPEND: "0"
      AGORAGENTIC_ALLOW_NETWORK_CANARIES: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - run: node bin/agoragentic-premortem-golden-loop.mjs run --repo . --ci
