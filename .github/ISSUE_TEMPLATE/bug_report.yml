name: Bug report
description: Report a CLI, audit, premortem, receipt, or self-heal issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Do not paste secrets, private plans, customer data, or full local receipts.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran, with private paths or plan text sanitized.
      placeholder: npx agoragentic-premortem-golden-loop audit --repo .
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - MCP
        - Docker
        - GitHub Actions
        - IDE template
        - Self-heal
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package version, and how you installed it.
      placeholder: Windows 11, Node 22, npx package version 0.1.0
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Paste only non-sensitive error output. Redact paths, secrets, plans, and receipts as needed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private repo contents, business plans, and local receipt data from this issue.
          required: true
