name: Integration smoke report
description: Report whether a local IDE, MCP client, Docker, or GitHub Actions integration worked.
title: "[Integration]: "
labels: ["integration"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for setup feedback. Keep it sanitized: no private plans, secrets, full receipts, or customer data.
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - Claude Desktop MCP
        - Cursor
        - Codex
        - Cline
        - Windsurf
        - Antigravity
        - Docker
        - GitHub Actions
        - systemd
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Worked
        - Worked with friction
        - Failed
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps tried
      description: List the setup steps and commands you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Friction or failure
      description: What was confusing, missing, or broken?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, client name/version, Node version, Docker version if relevant.
  - type: checkboxes
    id: boundary
    attributes:
      label: Safety boundary
      options:
        - label: I did not include secrets, private plans, full receipts, or sensitive repo content.
          required: true
