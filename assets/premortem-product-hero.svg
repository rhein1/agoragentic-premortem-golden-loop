<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agoragentic Premortem Golden Loop</title>
  <desc id="desc">A repository is framed as already failed, audited for release risks, given safe repair guidance, and rechecked into an evidence-backed launch decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081120"/><stop offset="1" stop-color="#16233b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45d6df"/><stop offset="1" stop-color="#ff7453"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 108H1280M0 320H1280M0 532H1280M170 0V640M640 0V640M1110 0V640" stroke="#263550" opacity="0.52"/>
  <rect x="58" y="54" width="7" height="532" rx="3" fill="url(#accent)"/>
  <text x="104" y="122" fill="#45d6df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750" letter-spacing="2">PREMORTEM GOLDEN LOOP</text>
  <text x="104" y="218" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">Find the launch failure</text>
  <text x="104" y="290" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">before your users do.</text>
  <text x="104" y="366" fill="#b8c5d9" font-family="Inter, Arial, sans-serif" font-size="24">Audit. Repair safely. Recheck. Keep the evidence.</text>
  <text x="104" y="464" fill="#ff9279" font-family="JetBrains Mono, Consolas, monospace" font-size="18">npx agoragentic-premortem-golden-loop audit --repo .</text>
  <text x="104" y="510" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="17">Local by default · no paid execution · no automatic deploy</text>

  <g transform="translate(710 78)">
    <rect width="506" height="486" rx="28" fill="#0b1527" stroke="#2a3a56" stroke-width="2"/>
    <g transform="translate(28 28)">
      <rect width="450" height="88" rx="16" fill="#101d33" stroke="#ff7453" stroke-opacity="0.55"/>
      <text x="22" y="31" fill="#ff9b84" font-family="JetBrains Mono, Consolas, monospace" font-size="13">FAILURE FRAME</text>
      <text x="22" y="60" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Assume the launch failed in six months.</text>
    </g>
    <path d="M253 118V144" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(28 148)">
      <rect width="450" height="104" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <text x="22" y="31" fill="#75edf3" font-family="JetBrains Mono, Consolas, monospace" font-size="13">EVIDENCE AUDIT</text>
      <text x="22" y="59" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">install · discovery · proof · approval · tests</text>
      <text x="22" y="82" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">blockers remain explicit instead of being hand-waved</text>
    </g>
    <path d="M253 254V280" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(28 284)">
      <rect width="216" height="156" rx="16" fill="#101d33" stroke="#ff7453" stroke-opacity="0.55"/>
      <text x="20" y="31" fill="#ff9b84" font-family="JetBrains Mono, Consolas, monospace" font-size="13">SAFE REPAIR</text>
      <text x="20" y="61" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">plan + IDE handoff</text>
      <text x="20" y="89" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">additive scaffolds only</text>
      <text x="20" y="116" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">owner reviews changes</text>
    </g>
    <g transform="translate(262 284)">
      <rect width="216" height="156" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <text x="20" y="31" fill="#75edf3" font-family="JetBrains Mono, Consolas, monospace" font-size="13">RECHECK</text>
      <text x="20" y="61" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">closure loop</text>
      <text x="20" y="89" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">resolved vs. still open</text>
      <text x="20" y="116" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">local receipt + evidence</text>
    </g>
  </g>
</svg>
